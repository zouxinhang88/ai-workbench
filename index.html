<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工作台</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 侧边栏：模式 + 配置区 ===== -->
  <aside class="sidebar">
    <div class="logo"><img src="logo.svg" class="logo-img" alt="AI Workstation"><span>AI 工作台</span></div>

    <!-- 模式切换 -->
    <div class="mode-switch" id="modeSwitch">
      <button type="button" class="mode-btn active" data-mode="local">本地 API</button>
      <button type="button" class="mode-btn" data-mode="cloud">云端 API</button>
    </div>

    <!-- 本地模式配置 -->
    <div class="config-block" id="localSettings">
      <div class="config-group">
        <label>API 地址</label>
        <input type="text" id="apiBase" value="http://127.0.0.1:1234" placeholder="http://127.0.0.1:1234" />
      </div>

      <div class="config-group">
        <label>API Key（本地服务一般留空）</label>
        <input type="password" id="apiKey" placeholder="可选" />
      </div>

      <div class="config-group">
        <label>模型</label>
        <div style="display:flex;gap:8px;">
          <select id="modelSelect" style="flex:1;"></select>
          <button id="refreshModels" class="btn-secondary" style="flex-shrink:0;">刷新</button>
        </div>
      </div>
    </div>

    <!-- 云端模式配置 -->
    <div class="config-block" id="cloudSettings" hidden>
      <div class="config-hint">云端走 OpenAI 兼容接口，实际请求地址为「Base URL + /chat/completions」，Base URL 必须以 https:// 开头。</div>

      <div class="config-group">
        <label>预设服务商</label>
        <select id="cloudPreset">
          <option value="">自定义</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="moonshot">Moonshot Kimi</option>
          <option value="zhipu">智谱 GLM</option>
          <option value="dashscope">阿里云百炼</option>
          <option value="siliconflow">SiliconFlow</option>
        </select>
      </div>

      <div class="config-group">
        <label>Base URL</label>
        <input type="text" id="cloudBase" placeholder="https://api.deepseek.com/v1" />
      </div>

      <div class="config-group">
        <label>API Key</label>
        <input type="password" id="cloudKey" placeholder="sk-..." />
      </div>

      <div class="config-group">
        <label>模型名</label>
        <input type="text" id="cloudModel" list="cloudModelList" placeholder="deepseek-chat" />
        <datalist id="cloudModelList">
          <option value="deepseek-chat"></option>
          <option value="deepseek-reasoner"></option>
          <option value="gpt-4o-mini"></option>
          <option value="gpt-4o"></option>
          <option value="moonshot-v1-8k"></option>
          <option value="glm-4-flash"></option>
          <option value="qwen-plus"></option>
        </datalist>
      </div>
    </div>

    <div class="config-group">
      <label>System Prompt（系统提示词）</label>
      <textarea id="systemPrompt">你是一个乐于助人的 AI 助手，回答简洁准确。</textarea>
    </div>

    <button id="newChat" class="btn-secondary">新建对话</button>

    <div class="sidebar-footer" id="status">未连接</div>
  </aside>

  <!-- ===== 主区域：聊天区 ===== -->
  <main class="main">
    <div class="chat-header">
      <span id="headerTitle">本地 AI 工作台</span>
      <span id="headerBadge" class="mode-badge">本地 · OpenAI 兼容</span>
    </div>

    <div id="chatBox"></div>

    <div class="input-area">
      <textarea id="userInput" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="sendBtn">发送</button>
      <button id="stopBtn" hidden>停止</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
